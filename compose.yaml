# Optional real PostgreSQL environment. Do not publish these demo credentials.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orderflow
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orderflow-data:/var/lib/postgresql/data
volumes:
  orderflow-data:
